[build-system]
requires = ["setuptools", "setuptools-scm", "setuptools-download"]
build-backend = "setuptools.build_meta"

[project]
name = "hadolint-py"
dynamic = ["version"]
description = "Python wrapper around invoking hadolint (https://github.com/hadolint/hadolint)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/shenxianpeng/hadolint-pre-commit"

[dependency-groups]
test = [
    "coverage[toml]>=7",
    "pytest>=7",
    "setuptools>=70.1",  # setup.py imports setuptools.command.bdist_wheel
]

[tool.setuptools]
packages = ["hadolint_py"]

[tool.setuptools_scm]
# Version is derived automatically from the release tag (e.g. tag vX.Y.Z.W → version X.Y.Z.W).
# No manual version bumping needed — the publish workflow pins the version to
# the tag via SETUPTOOLS_SCM_PRETEND_VERSION; the tag is the only input.
#
# fallback_version: allows building from a source tree without git metadata
#   (e.g. `pip install .` from a tarball) instead of failing.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test the source tree, even when the package is also installed.
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
# The package plus setup.py: pre-commit builds the hook from source, so the
# wheel-tagging code in setup.py runs on every user's machine too.
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
