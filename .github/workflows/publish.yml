name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-tag:
    name: Check release tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag becomes the PyPI version, which cannot be reused once
      # uploaded: refuse anything but v<bundled hadolint>.<wrapper patch>
      # (e.g. a drafted v2.15.2 while hadolint 2.15.1 is bundled).
      - name: Check tag matches the bundled hadolint version
        shell: bash
        run: |
          bundled="$(sed -nE 's#^[[:space:]]*url = https://github\.com/hadolint/hadolint/releases/download/v([^/]+)/.*#\1#p' setup.cfg | sort -u)"
          if [[ ! "$bundled" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=setup.cfg::expected exactly one hadolint version in setup.cfg, found: ${bundled:-none}"
            exit 1
          fi
          prefix="v${bundled}."
          if [[ "$GITHUB_REF_NAME" != "$prefix"* || ! "${GITHUB_REF_NAME#"$prefix"}" =~ ^[0-9]+$ ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match ${prefix}<wrapper-patch>: setup.cfg bundles hadolint ${bundled} (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "Release tag ${GITHUB_REF_NAME} matches the bundled hadolint ${bundled}"

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    needs: check-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # linux x86_64
          - os: ubuntu-24.04-arm     # linux arm64
          - os: macos-15-intel       # macOS x86_64
          - os: macos-latest         # macOS arm64
          - os: windows-latest       # windows x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build
        run: pip install build

      - name: Pin version to release tag
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify installation
        shell: bash
        run: |
          pip install dist/*.whl
          hadolint --version
          # The published version must equal the release tag (v prefix stripped).
          # Note: no `-q` here — grep -q exits early and closes the pipe while
          # pip is still writing, which fails the pipeline under `set -o pipefail`.
          pip show hadolint-py | grep "Version: ${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    needs: check-tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build
        run: pip install build

      - name: Pin version to release tag
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
