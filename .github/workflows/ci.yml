name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: Install package
        run: pip install .

      - name: Verify version derived from git tag
        run: python -c "import hadolint_py; print('hadolint-py version:', hadolint_py.__version__)"

      - name: Verify hadolint binary
        run: hadolint --version

      - name: Lint test Dockerfile
        run: hadolint tests/Dockerfile
