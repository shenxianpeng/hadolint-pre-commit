# WHY THIS FILE EXISTS
# --------------------
# All project metadata lives in pyproject.toml. This file exists solely for
# the [setuptools_download] configuration, which cannot be moved to
# pyproject.toml for two reasons:
#
#   1. setuptools-download reads its configuration exclusively from setup.cfg
#      and does not support [tool.setuptools_download] in pyproject.toml.
#
#   2. The plugin uses a non-standard INI format that allows repeated section
#      names (multiple [hadolint] blocks for different platforms), which
#      cannot be expressed in TOML at all.
#
# To update hadolint: bump the version in all urls below and update the
# corresponding sha256 hashes (download each binary and run sha256sum).

[options]
setup_requires =
    setuptools-download

[setuptools_download]
download_scripts =
    [hadolint]
    group = hadolint-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
    sha256 = c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    [hadolint]
    group = hadolint-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-arm64
    sha256 = f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d
    [hadolint]
    group = hadolint-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-macos-x86_64
    sha256 = ffe9bb18b23d5ed1eae50237aecdbb523d016e96da0bd4e7aa432040acfc3fde
    [hadolint]
    group = hadolint-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-macos-arm64
    sha256 = 5c09f3213f8e40406abe048233d985eebef336d4a6a20021be47fadb6cf480a2
    [hadolint.exe]
    group = hadolint-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-windows-x86_64.exe
    sha256 = 01d927294962b5387f9ead4f18679158452be4f17c765ad0bdffe5264b9c7b0a
